[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ldc"
version = "2.1.0"
description = "Experimental machine learning study for liver disease classification using Orange3 & Python"
requires-python = ">=3.11"

dependencies = [
    # Additional
    "loguru",
    "plotly",
    "argcomplete",
    "seaborn",
    "Orange3", # Core Orange3
    "pandas>=2.3.3",
    "jinja2>=3.1.6",
    "bump-my-version>=1.3.0",
    "ruff",
    # GUI
    "PyQt6",
    "PyQt6-WebEngine",
]

[project.scripts]
liver = "liver.cli:main"
liver-app = "liver.app:main"

[tool.bumpversion]
current_version = "2.1.0"
commit = true
tag = true
parse = "(?P<major>\\d+)\\.(?P<minor>\\d+)\\.(?P<patch>\\d+)"
serialize = ["{major}.{minor}.{patch}"]
search = "{current_version}"
replace = "{new_version}"
regex = false
ignore_missing_version = false
ignore_missing_files = false
sign_tags = false
tag_name = "v{new_version}"
tag_message = "Bump version: {current_version} → {new_version}"
allow_dirty = true
message = "Bump version: {current_version} → {new_version}"
moveable_tags = []
commit_args = ""
setup_hooks = []
pre_commit_hooks = []
post_commit_hooks = []
allow_shell_hooks = true

[tool.ruff]
# Target Python version
target-version = "py311"

# Line length (for formatter)
line-length = 100

# Where to apply autofix
fix = true

# Exclude common junk
exclude = [
    ".git",
    ".ruff_cache",
    ".ldc",
    ".venv"
]

[tool.ruff.lint]
# Enable the most useful rule sets
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    # "W",   # pycodestyle warnings
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "A",   # builtins
    "C4",  # comprehensions
    "SIM", # simplify
    "TID", # tidy imports
]

# Rules that are too annoying for real projects
ignore = [
    "E501",  # line length (handled by formatter)
    "B008",  # do not call function in default argument (too strict)
    "SIM105",# suppress "use contextlib.suppress" suggestion
]

# isort-style import sorting
[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true
known-first-party = ["liver"]

# Ruff formatter
[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
line-ending = "lf"

[tool.uv.sources]
devtools = { git = "https://github.com/Dakata99/devtools.git" }

[dependency-groups]
dev = [
    "devtools[docs]",
]
