name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run dev-lint

      - name: Format check
        run: uv run dev-fmt --check

      - name: Type check
        run: uv run dev-check

  experiments:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Sync dependencies
          run: |
            uv sync

        - name: Run experiment 1
          run: |
            uv run liver --experiment 1 --hold-out --config default --debug

        - name: Run experiment 2
          run: |
            uv run liver --experiment 2 --hold-out --config default --debug

        - name: Run experiment 3
          run: |
            uv run liver --experiment 3 --hold-out --config default --debug

        - name: Copy generated reports
          run: |
            mkdir -p public/reports
            cp -r reports/* public/reports/

        - name: Configure GitHub Pages
          uses: actions/configure-pages@v5

        - name: Upload reports as artifact
          uses: actions/upload-artifact@v4
          with:
            name: experiment-reports
            path: reports/
