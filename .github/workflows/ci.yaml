name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  experiments:
    runs-on: ubuntu-latest

    steps:
        - uses: actions/checkout@v4

        - name: Install uv
          uses: astral-sh/setup-uv@v5

        - name: Run experiment 1
          run: |
            source setup
            liver --experiment 1 --hold-out --config default

        - name: Run experiment 2
          run: |
            source setup
            liver --experiment 2 --hold-out --config default

        - name: Run experiment 3
          run: |
            source setup
            liver --experiment 3 --hold-out --config default
